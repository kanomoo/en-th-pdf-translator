services:
  - type: web
    name: en-th-pdf-translator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 app:app
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: translator-data
      mountPath: /var/data
      sizeGB: 1
